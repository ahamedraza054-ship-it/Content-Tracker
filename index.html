<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube Multi-Channel Content Scheduler & Analyzer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --success-color: #22c55e;
            --warning-color: #f59e0b;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        h1 {
            font-size: 1.5rem;
            margin: 0;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-box h3 {
            margin: 0 0 10px 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        .stat-box p {
            font-size: 1.8rem;
            margin: 0;
            font-weight: bold;
            color: var(--accent-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
        }

        .badge {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .badge.active {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--success-color);
        }

        .badge.pending {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--warning-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>YouTube Multi-Channel Content Scheduler</h1>
            <div id="current-date" style="color: var(--text-muted);"></div>
        </header>

        <div class="grid">
            <div class="stat-box">
                <h3>Total Campaigns</h3>
                <p id="total-campaigns">4</p>
            </div>
            <div class="stat-box">
                <h3>Active Upload Days</h3>
                <p id="active-days">0</p>
            </div>
            <div class="stat-box">
                <h3>Pending Approvals</h3>
                <p id="pending-count" style="color: var(--warning-color);">3</p>
            </div>
        </div>

        <div class="card" style="margin-top: 20px;">
            <h2>Campaign Analysis & Schedule Log</h2>
            <p style="color: var(--text-muted); font-size: 0.9rem;">Accurate day indexing starting correctly from Day 1 and matching your target start dates.</p>
            
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Day Index</th>
                            <th>Date</th>
                            <th>Campaign Name</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="analysis-table-body">
                        <!-- JavaScript will dynamically fill this accurately without offset errors -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // Display current date in header
        document.getElementById('current-date').innerText = new Date().toLocaleDateString('en-US', { 
            weekday: 'short', year: 'numeric', month: 'short', day: 'numeric' 
        });

        // Fixed Indexing & Day calculation logic (No offset mismatch)
        function loadAnalysisData() {
            const tbody = document.getElementById('analysis-table-body');
            tbody.innerHTML = '';

            // Starting date configuration (e.g., Oct 28 start)
            const startDate = new Date('2026-10-28');
            const totalDaysToShow = 10;
            
            const campaigns = ['Funding Pips', 'Jogee Neel', 'Boxabl', "MC's Clippers"];

            for (let i = 0; i < totalDaysToShow; i++) {
                // Correct day calculation starting precisely from 1 (i + 1)
                const currentDayNumber = i + 1; 

                // Correct date calculation adding days precisely
                const itemDate = new Date(startDate);
                itemDate.setDate(startDate.getDate() + i);
                
                const formattedDate = itemDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
                
                // Assign sample campaigns in a rotating loop
                const campaignName = campaigns[i % campaigns.length];
                let statusBadge = '<span class="badge active">Approved</span>';
                
                if (currentDayNumber > 3 && (campaignName === 'Jogee Neel' || campaignName === 'Boxabl' || campaignName === "MC's Clippers")) {
                    statusBadge = '<span class="badge pending">Pending Review</span>';
                }

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>Day ${currentDayNumber}</strong></td>
                    <td>${formattedDate}</td>
                    <td>${campaignName}</td>
                    <td>${statusBadge}</td>
                `;
                tbody.appendChild(row);
            }

            document.getElementById('active-days').innerText = totalDaysToShow;
        }

        // Initialize table on load
        window.onload = loadAnalysisData;
    </script>
</body>
</html>
